name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: bash -n UAS.sh
      - run: shellcheck UAS.sh
      - run: uv run --no-project python -m unittest discover -s tests -v
